{% extends 'base.html' %}
{% block title %}Tambah Transaksi{% endblock %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6 bg-white p-4 rounded-3 shadow-sm">
            <h2 class="mb-3">Form Catat Transaksi Baru</h2>
            <form action="{{ url_for('tambah') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Tanggal Transaksi:</label>
                    <input type="date" name="tanggal" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Keterangan:</label>
                    <input type="text" name="keterangan" class="form-control" required placeholder="Contoh: Gaji, Belanja, Makan">
                </div>
                <div class="mb-3">
                    <label class="form-label">Jumlah Nominal (Rp):</label>
                    <input type="number" name="jumlah" class="form-control" required placeholder="Contoh: 150000">
                </div>
                <div class="mb-3">
                    <label class="form-label">Jenis Transaksi:</label>
                    <select name="jenis" class="form-select">
                        <option value="masuk">Pemasukan (Uang Masuk)</option>
                        <option value="keluar">Pengeluaran (Uang Keluar)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Simpan Transaksi</button>
            </form>
        </div>
    </div>
{% endblock %}
